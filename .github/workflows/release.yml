# Attaches the roster's built files to a release, after the same check as CI,
# so a release never carries files the engine refuses:
#   jrpgbattle-content-<tag>.zip  every content file, src/content/<name>.json,
#                                 at the paths they take in jrpg-battle, for a
#                                 deployment's build to drop over a checkout,
#                                 replacing all of its content
#   jrpgbattle-api-<tag>.zip      the static API's files, entry by entry, which
#                                 pages.yml publishes to GitHub Pages once this
#                                 run succeeds, when PUBLISH_API is "true"
# Runs when a release is published. Run it by hand from the Actions tab with a
# tag to attach the files to a release whose run failed: a re-run of a release
# event uses the workflow as it was at that tag, so a fix to this file only
# reaches an existing release this way.
name: release

on:
  release:
    types: [published]
  workflow_dispatch:
    inputs:
      tag:
        description: The published release to attach the files to, such as v0.12.0
        required: true
        type: string

permissions:
  contents: write

jobs:
  attach:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v5
        with:
          ref: ${{ github.event.release.tag_name || inputs.tag }}

      # The tag names the content it carries (README "Releasing"), so a release
      # whose tag and manifest disagree would put the wrong version in matches.
      - name: Require the tag to match the manifest's version
        env:
          TAG: ${{ github.event.release.tag_name || inputs.tag }}
        run: |
          VERSION="v$(node -p "require('./content/setting/manifest.json').version")"
          if [ "$TAG" != "$VERSION" ]; then
            echo "::error::The release tag is $TAG, but content/setting/manifest.json says $VERSION. Bump the manifest in a PR, or tag the commit that has it."
            exit 1
          fi

      - name: Require ENGINE_READ_TOKEN
        env:
          TOKEN: ${{ secrets.ENGINE_READ_TOKEN }}
        run: |
          if [ -z "$TOKEN" ]; then
            echo "::error::The repository secret ENGINE_READ_TOKEN is missing or empty; the release is checked against jrpg-battle like every PR."
            exit 1
          fi

      - name: Read the pinned engine release
        id: engine
        run: echo "tag=$(node -p "require('./engine.json').tag")" >> "$GITHUB_OUTPUT"

      - uses: actions/checkout@v5
        with:
          repository: stardustsuperwizard/jrpg-battle
          ref: ${{ steps.engine.outputs.tag }}
          token: ${{ secrets.ENGINE_READ_TOKEN }}
          path: jrpg-battle
          persist-credentials: false

      - uses: actions/setup-node@v5
        with:
          node-version-file: .nvmrc

      - name: Test and build
        run: |
          npm test
          npm run build

      - name: Check the roster
        run: npm run check -- 300
        env:
          JRPG_BATTLE: ${{ github.workspace }}/jrpg-battle

      # A release asset can't hold folders, and the API has two index.json
      # files, so its files go up zipped, as they are served.
      - name: Attach the content files and the API
        env:
          GH_TOKEN: ${{ github.token }}
          TAG: ${{ github.event.release.tag_name || inputs.tag }}
        run: |
          CONTENT="jrpgbattle-content-$TAG.zip"
          API="jrpgbattle-api-$TAG.zip"
          (cd dist && zip -r "../$CONTENT" src)
          (cd dist/api && zip -r "../../$API" .)
          unzip -l "$CONTENT"
          unzip -l "$API"
          gh release upload "$TAG" "$CONTENT" "$API" --clobber

