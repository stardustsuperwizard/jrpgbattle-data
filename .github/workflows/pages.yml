# Publishes the roster's static API (dist/api/, built by scripts/build.mjs) to
# GitHub Pages on every push to main. It deploys only once Pages is turned on
# under Settings > Pages with "GitHub Actions" as the source. Pages sites are
# public, even for a private repository: publishing this makes the roster's
# data public (README "Static API").
name: pages

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

# One deploy at a time; a newer push replaces a queued one, never a running one.
concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  deploy:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - uses: actions/checkout@v5

      - uses: actions/setup-node@v5
        with:
          node-version-file: .nvmrc

      - name: Test and build
        run: |
          npm test
          npm run build

      - uses: actions/upload-pages-artifact@v3
        with:
          path: dist/api

      - id: deployment
        uses: actions/deploy-pages@v4
