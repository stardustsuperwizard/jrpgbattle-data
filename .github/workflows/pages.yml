# Publishes the roster's static API (dist/api/, built by scripts/build.mjs) to
# GitHub Pages on every push to main, once publishing is switched on: the
# repository variable PUBLISH_API set to "true" (Settings > Secrets and
# variables > Actions > Variables), and Pages turned on with "GitHub Actions"
# as its source. Until then the job is skipped rather than failed, so main
# stays green and nothing is published. Pages sites are public, even for a
# private repository: publishing this makes the roster's data public (README
# "Static API").
name: pages

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

# One deploy at a time; a newer push replaces a queued one, never a running one.
concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  deploy:
    if: vars.PUBLISH_API == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 10
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - uses: actions/checkout@v5

      - uses: actions/setup-node@v5
        with:
          node-version-file: .nvmrc

      - name: Test and build
        run: |
          npm test
          npm run build

      - uses: actions/upload-pages-artifact@v3
        with:
          path: dist/api

      - id: deployment
        uses: actions/deploy-pages@v4
